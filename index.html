<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan 2028</title>
<!-- LOCKED LAYER — the "Tunnel" tokens, linked from cuddly-lamp (never inlined) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/nihilisticiconoclast/cuddly-lamp@main/assets/tokens.css">
<style>
  /* ── PAGE LAYER for the "Tunnel" house aesthetic ────────────────────────────
     The locked layer (palette, type, hard edges, the .sig / .doodle figures)
     comes from cuddly-lamp's tokens.css, linked above. The renderer keys status
     colour off these CSS variables, so they are mapped onto the Tunnel palette:
     no greens, no extra hues — distinction comes from weight and outline, not
     temperature. The single red --route is spent on the timeline's "you are
     here" marker; amber is reserved for the figures, never the UI. */
  :root {
    --not_started: var(--contour);                                   /* unsurveyed   */
    --in_progress: var(--incident);                                  /* active / data*/
    --done:        var(--index);                                     /* complete     */
    --dropped:     color-mix(in srgb, var(--contour) 50%, var(--paper)); /* faded    */
    --loud:        var(--route);                                     /* the one red  */
  }
  body { max-width: 980px; margin: 0 auto; padding: 28px 16px 80px; }

  /* masthead — fixed house mark beside the wordmark */
  .masthead { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .masthead .wordmark {
    font-family: var(--font-data); font-size: .72rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--contour); line-height: 1.4;
  }

  h1 { font-size: var(--step-3); margin: 0 0 .12em; }
  .sub { color: color-mix(in srgb, var(--ink) 85%, transparent); margin: 0 0 24px; max-width: 70ch; }
  h2 {
    font-family: var(--font-data); font-size: .74rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .16em; color: var(--contour);
    margin: 40px 0 14px;
  }
  section { margin-bottom: 8px; }

  /* Staleness gauge — loud means heavy ink, not a second red */
  .stale {
    border: var(--rule); background: var(--paper); padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .stale .n { font-family: var(--font-data); font-size: 28px; font-weight: 600; line-height: 1; }
  .stale.loud { border: 2px solid var(--index); border-left: 4px solid var(--index); background: color-mix(in srgb, var(--index) 8%, var(--paper)); }
  .stale.loud .n { color: var(--index); }

  /* Audit scoreboard — hard-edged cards, status as an outlined mono tag */
  .audit { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: color-mix(in srgb, var(--contour) 38%, transparent); border: var(--rule); }
  .audit .item { background: var(--paper); padding: 18px; min-height: 132px; display: flex; flex-direction: column; }
  .audit .item .t { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.25; }
  .audit .item .st {
    margin-top: auto; align-self: flex-start; font-family: var(--font-data);
    font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
    color: var(--s); background: transparent; border: 1px solid var(--s); padding: 3px 9px;
  }

  /* Timeline */
  .tl-wrap { border: var(--rule); background: var(--paper); padding: 20px 16px 14px; overflow-x: auto; }
  .tl { position: relative; min-width: 820px; }
  .tl .bands { position: relative; height: 54px; border: var(--rule); }
  .tl .band {
    position: absolute; top: 0; bottom: 0; display: flex; align-items: center;
    justify-content: center; font-family: var(--font-data); font-size: 12px;
    color: var(--index); border-right: 1px solid color-mix(in srgb, var(--contour) 38%, transparent);
  }
  .tl .band:nth-child(odd)  { background: color-mix(in srgb, var(--index) 6%, var(--paper)); }
  .tl .band:nth-child(even) { background: color-mix(in srgb, var(--index) 12%, var(--paper)); }

  /* Today pin — the single red "route" marker: you are here */
  .tl .today { position: absolute; top: -14px; bottom: 0; width: 2px; background: var(--route); z-index: 5; }
  .tl .today .flag {
    position: absolute; top: -26px; font-family: var(--font-data); font-size: 11px;
    font-weight: 600; letter-spacing: .04em; color: var(--paper);
    background: var(--route); padding: 3px 9px; white-space: nowrap;
  }
  .tl .today .flag::after { content: ""; position: absolute; left: 12px; bottom: -5px; border: 5px solid transparent; border-top-color: var(--route); border-bottom: 0; }

  /* Objective markers */
  .tl .markers { position: relative; margin-top: 16px; }
  .tl .leaders { position: absolute; top: 0; left: 0; width: 100%; height: 72px; overflow: visible; pointer-events: none; }
  .tl .leaders line { stroke: color-mix(in srgb, var(--contour) 38%, transparent); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .tl .tick { position: absolute; top: 9px; width: 9px; height: 9px; transform: translateX(-50%); background: var(--contour); }
  .tl .col { position: absolute; top: 76px; transform: translateX(-50%); width: max-content; max-width: 150px; text-align: center; }
  .tl .col .date { font-family: var(--font-data); font-size: 11px; font-weight: 600; color: var(--ink); margin-bottom: 6px; white-space: nowrap; }
  .tl .col .rows { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .tl .col .o { display: flex; align-items: center; gap: 6px; font-family: var(--font-data); font-size: 11px; color: var(--contour); white-space: nowrap; }
  .tl .col .o .d2 { width: 9px; height: 9px; background: var(--s); flex: none; }
  .tl .col .o b { color: var(--ink); font-weight: 600; }
  .tl .axis { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 12px; color: var(--contour); margin-top: 12px; border-top: var(--rule); padding-top: 8px; }

  /* Phase panels */
  .phase { border: var(--rule); background: var(--paper); padding: 16px; margin-bottom: 12px; }
  .phase .head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .phase .name { font-family: var(--font-display); font-weight: 560; font-size: 1.2rem; }
  .phase .range { font-family: var(--font-data); font-size: 12px; color: var(--contour); }
  .phase .nums { display: flex; gap: 28px; margin: 12px 0 14px; }
  .phase .nums .pair { font-family: var(--font-data); font-size: 12px; color: var(--contour); }
  .phase .nums .pair b { display: block; font-family: var(--font-data); font-size: 22px; color: var(--ink); font-weight: 600; }
  .obj { display: flex; gap: 10px; padding: 9px 0; border-top: var(--rule); }
  .obj .dot { flex: none; width: 9px; height: 9px; margin-top: 7px; background: var(--s); }
  .obj .body { flex: 1; min-width: 0; }
  .obj .t { font-size: .95rem; }
  .obj.dropped .t { text-decoration: line-through; color: var(--contour); }
  .obj .meta { font-family: var(--font-data); font-size: 11px; color: var(--contour); margin-top: 2px; }
  .obj .meta .st { color: var(--s); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .obj .note { font-size: 12px; color: var(--contour); margin-top: 4px; }

  /* Log */
  .log { list-style: none; padding: 0; margin: 0; }
  .log li { padding: 10px 0; border-top: var(--rule); display: flex; align-items: baseline; gap: 16px; }
  .log li .d { flex: none; width: 104px; text-align: right; font-family: var(--font-data); color: var(--contour); font-variant-numeric: tabular-nums; font-size: 13px; }
  .log li .n { flex: 1; }
  .err { color: var(--route); }

  /* the per-page doodle: a margin decoration, NOT a section of its own. Pulled out
     of flow and tucked into the right gutter, behind the content (the opaque panels
     cover it; it shows only in the empty margins) — so it never adds a band, shoves
     the page around, or fights the text. */
  body { position: relative; }
  .doodle {
    position: absolute; top: clamp(72px,10vw,120px); right: 0;
    width: clamp(140px,18vw,260px); margin: 0; opacity: .6; z-index: -1; pointer-events: none;
  }
</style>
</head>
<body data-seed="plan-2028">
<div class="masthead">
  <span class="sig" id="sig"></span>
  <span class="wordmark">Plan 2028<br>trajectory tracker</span>
</div>
<h1>Plan 2028</h1>
<p class="sub" id="direction"></p>
<!-- per-page doodle: a seeded scribble, off to the right, between sections -->
<div class="doodle doodle--right doodle--bleed-right" id="doodle"></div>
<div id="app"><p class="sub">Loading plan.json…</p></div>

<script>
const DAY = 86400000;
const today = new Date();

function d(s) { return new Date(s + "T00:00:00Z"); }
function days(a, b) { return Math.floor((b - a) / DAY); }
function pct(start, end, at) { return Math.max(0, Math.min(1, (at - start) / (end - start))) * 100; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function fmt(s) { const x = d(s); return x.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); }

function render(plan) {
  document.getElementById("direction").textContent = plan.meta.direction;
  const hStart = d(plan.meta.horizon_start), hEnd = d(plan.meta.horizon_end);
  const app = document.getElementById("app");
  let html = "";

  // Staleness gauge (top, prominent)
  const last = plan.log[plan.log.length - 1];
  const stale = days(d(last.date), today);
  html += `<section><div class="stale ${stale > 14 ? "loud" : ""}">
    <span class="n">${stale}</span>
    <span>day${stale === 1 ? "" : "s"} since the last log entry (${esc(last.date)})${stale > 14 ? " — this tracker is going stale." : ""}</span>
  </div></section>`;

  // 2028 audit scoreboard
  html += `<section><h2>2028 audit</h2><div class="audit">`;
  for (const a of plan.audit_2028) {
    html += `<div class="item" style="--s:var(--${a.status})">
      <div class="t">${esc(a.title)}</div>
      <span class="st">${a.status.replace("_", " ")}</span>
    </div>`;
  }
  html += `</div></section>`;

  // Timeline
  html += `<section><h2>Timeline · ${esc(plan.meta.horizon_start)} → ${esc(plan.meta.horizon_end)}</h2><div class="tl-wrap"><div class="tl">`;
  html += `<div class="bands">`;
  for (const p of plan.phases) {
    const l = pct(hStart, hEnd, d(p.start)), r = pct(hStart, hEnd, d(p.end));
    html += `<div class="band" style="left:${l}%;width:${r - l}%" title="${esc(p.name)}">${esc(p.name.split("—")[0].trim())}</div>`;
  }
  // Today pin
  const tp = pct(hStart, hEnd, today);
  const flagPos = tp < 12 ? `left:6px` : tp > 88 ? `right:6px` : `left:50%;transform:translateX(-50%)`;
  html += `<div class="today" style="left:${tp}%"><span class="flag" style="${flagPos}">YOU ARE HERE · ${fmt(today.toISOString().slice(0,10))}</span></div>`;
  html += `</div>`;

  // Objective markers: group by due date, lay the labels out evenly (uniform height, no overlap),
  // and tie each back to its true position on the axis with a leader line.
  const groups = {};
  for (const p of plan.phases) for (const o of p.objectives) (groups[o.due] ||= []).push(o);
  const dates = Object.keys(groups).sort();
  const N = dates.length;
  let ticks = "", lines = "", cols = "", maxRows = 1;
  dates.forEach((due, i) => {
    const tx = pct(hStart, hEnd, d(due));   // true date position
    const sx = (i + 0.5) / N * 100;         // even label slot
    maxRows = Math.max(maxRows, groups[due].length);
    ticks += `<span class="tick" style="left:${tx}%"></span>`;
    lines += `<line x1="${tx * 10}" y1="14" x2="${sx * 10}" y2="72"></line>`;
    let rows = "";
    for (const o of groups[due]) {
      rows += `<div class="o" style="--s:var(--${o.status})" title="${esc(o.title)} — ${o.status.replace("_"," ")}"><span class="d2"></span><b>${esc(o.id)}</b></div>`;
    }
    cols += `<div class="col" style="left:${sx}%"><div class="date">${fmt(due)}</div><div class="rows">${rows}</div></div>`;
  });
  html += `<div class="markers" style="height:${76 + maxRows * 18 + 14}px">
    <svg class="leaders" viewBox="0 0 1000 72" preserveAspectRatio="none">${lines}</svg>${ticks}${cols}</div>`;
  html += `<div class="axis"><span>${fmt(plan.meta.horizon_start)}</span><span>${fmt(plan.meta.horizon_end)}</span></div>`;
  html += `</div></div></section>`;

  // Phase panels
  html += `<section><h2>Phases</h2>`;
  for (const p of plan.phases) {
    const start = d(p.start), end = d(p.end);
    const doneCount = p.objectives.filter(o => o.status === "done").length;
    const total = p.objectives.length;
    const elapsed = Math.round(pct(start, end, today));
    html += `<div class="phase">
      <div class="head"><span class="name">${esc(p.name)}</span><span class="range">${esc(p.start)} → ${esc(p.end)}</span></div>
      <div class="nums">
        <span class="pair"><b>${doneCount} / ${total}</b>objectives done</span>
        <span class="pair"><b>${elapsed}%</b>of window elapsed</span>
      </div>`;
    for (const o of [...p.objectives].sort((a, b) => a.due.localeCompare(b.due))) {
      const dleft = days(today, d(o.due));
      let when;
      if (o.status === "done") when = "done";
      else if (o.status === "dropped") when = "dropped";
      else if (dleft < 0) when = `overdue ${-dleft}d`;
      else when = `due in ${dleft}d`;
      html += `<div class="obj ${o.status}" style="--s:var(--${o.status})">
        <span class="dot"></span>
        <div class="body">
          <div class="t">${esc(o.title)}</div>
          <div class="meta"><span class="st">${o.status.replace("_"," ")}</span> · ${esc(o.id)} · ${esc(o.due)} · ${when}</div>
          ${o.note ? `<div class="note">${esc(o.note)}</div>` : ""}
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</section>`;

  // Log (reverse chronological)
  html += `<section><h2>Log</h2><ul class="log">`;
  for (const e of [...plan.log].reverse()) {
    html += `<li><span class="d">${esc(e.date)}</span><span class="n">${esc(e.note)}</span></li>`;
  }
  html += `</ul></section>`;

  app.innerHTML = html;
}

fetch("plan.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(render)
  .catch(err => {
    document.getElementById("app").innerHTML =
      `<p class="err">Could not load plan.json (${esc(err.message)}).<br>
       If viewing locally, serve over http — e.g. <code>python -m http.server</code> — not file://.</p>`;
  });
</script>

<!-- the signature generator: FIXED house mark + a per-page doodle. Linked from
     the CDN, never inlined, so the figure logic stays in lock-step with the tokens -->
<script src="https://cdn.jsdelivr.net/gh/nihilisticiconoclast/cuddly-lamp@main/assets/tunnel-figure.js"></script>
<script>
  (function () {
    var seed = document.body.dataset.seed || location.pathname || document.title;
    document.getElementById('sig').innerHTML = TunnelFigure.tunnelFigureSVG(null, { variant: 'mark' });
    document.getElementById('doodle').innerHTML = TunnelFigure.tunnelFigureSVG(seed, { variant: 'doodle' });
  })();
</script>
</body>
</html>
